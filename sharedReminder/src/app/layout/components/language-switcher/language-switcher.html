<div class="relative w-fit" (click)="onContainerClick($event)">
  <button
    type="button"
    (click)="toggleMenu()"
    class="flex items-center justify-between gap-3 rounded-2xl border border-gray-200 bg-white text-gray-700 shadow-sm transition-all hover:border-indigo-300 hover:shadow-md dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100"
    [ngClass]="compact ? 'min-w-28 px-3 py-2 text-xs' : 'min-w-36 px-3 py-2 text-sm font-semibold'"
  >
    <span class="flex items-center gap-2">
      <img [src]="selectedLanguage.icon" [alt]="selectedLanguage.label" class="h-5 w-5 rounded-full object-cover" />
      <span>{{ selectedLanguage.shortLabel }}</span>
    </span>
    <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 transition-transform" [class.rotate-180]="isOpen"></i>
  </button>

  <div
    *ngIf="isOpen"
    class="absolute top-[calc(100%+0.5rem)] z-50 overflow-hidden rounded-2xl border border-gray-200 bg-white p-1.5 text-left shadow-xl shadow-gray-200/60 dark:border-gray-700 dark:bg-gray-900 dark:shadow-black/20"
    [ngClass]="align === 'right' ? 'right-0' : 'left-0'"
  >
    <button
      *ngFor="let language of languages"
      type="button"
      (click)="changeLang(language.code)"
      class="flex w-full items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium transition-colors"
      [ngClass]="currentLang === language.code
        ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-200'
        : 'text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800'"
    >
      <img [src]="language.icon" [alt]="language.label" class="h-5 w-5 rounded-full object-cover" />
      <span class="flex-1">{{ language.label }}</span>
      <span class="text-xs uppercase tracking-wide opacity-70">{{ language.shortLabel }}</span>
    </button>
  </div>
</div>
