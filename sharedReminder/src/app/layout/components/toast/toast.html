@if (notificationService.toast$ | async; as toast) {
<div class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex justify-center px-4 sm:justify-end">
  <div
    class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-3xl border shadow-2xl backdrop-blur-xl transition-all duration-300"
    [ngClass]="{
      'border-red-200/80 bg-red-50/90 text-red-950 dark:border-red-900/60 dark:bg-red-950/60 dark:text-red-50': toast.type === 'error',
      'border-emerald-200/80 bg-emerald-50/90 text-emerald-950 dark:border-emerald-900/60 dark:bg-emerald-950/60 dark:text-emerald-50': toast.type === 'success',
      'border-sky-200/80 bg-sky-50/90 text-sky-950 dark:border-sky-900/60 dark:bg-sky-950/60 dark:text-sky-50': toast.type === 'info',
      'border-amber-200/80 bg-amber-50/90 text-amber-950 dark:border-amber-900/60 dark:bg-amber-950/60 dark:text-amber-50': toast.type === 'warning'
    }">
    <div class="flex items-start gap-3 px-4 py-4 sm:px-5">
      <div class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-2xl text-sm font-bold" [ngClass]="{
          'bg-red-500 text-white': toast.type === 'error',
          'bg-emerald-500 text-white': toast.type === 'success',
          'bg-sky-500 text-white': toast.type === 'info',
          'bg-amber-500 text-white': toast.type === 'warning'
        }">
        @switch (toast.type) {
        @case ('error') { ! }
        @case ('success') { OK }
        @case ('info') { i }
        @default { ! }
        }
      </div>

      <div class="min-w-0 flex-1">
        @if (toast.title) {
        <p class="text-sm font-semibold tracking-tight">{{ toast.title }}</p>
        }
        <p class="mt-1 text-sm leading-5 opacity-90">{{ toast.message }}</p>
      </div>

      <button type="button"
        class="rounded-xl p-2 opacity-70 transition hover:bg-black/5 hover:opacity-100 dark:hover:bg-white/10"
        (click)="close()" aria-label="Close notification">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
}
