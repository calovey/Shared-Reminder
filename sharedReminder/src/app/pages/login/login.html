<div class="text-center mb-8">
    <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Hoş Geldiniz</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Hesabınıza giriş yaparak devam edin.</p>
</div>

<form class="space-y-4" (ngSubmit)="login()">
    <div *ngIf="errorMessage" class="mb-4 text-sm text-red-500 text-center">
        {{ errorMessage }}
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-posta</label>
        <input type="email" [(ngModel)]="email" name="email" required
            class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all dark:text-white"
            placeholder="xxx@mail.com">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Şifre</label>
        <input type="password" [(ngModel)]="password" name="password" required
            class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all dark:text-white"
            placeholder="••••••••">
    </div>

    <div class="flex items-center justify-between text-xs mt-2">
        <label class="flex items-center cursor-pointer text-gray-600 dark:text-gray-400">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe"
                class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2">
            Beni hatırla
        </label>
        <a href="#" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Şifremi unuttum</a>
    </div>

    <button type="submit" [disabled]="loading"
        class="w-full py-3 px-4 mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-95 disabled:opacity-50">
        <span *ngIf="!loading">Giriş Yap</span>
        <span *ngIf="loading">Giriş Yapılıyor...</span>
    </button>
</form>

<div class="relative flex py-6 items-center">
    <div class="flex-grow border-t border-gray-200 dark:border-gray-800"></div>
    <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase tracking-widest">Veya</span>
    <div class="flex-grow border-t border-gray-200 dark:border-gray-800"></div>
</div>

<div class="grid grid-cols-2 gap-4">
    <button type="button"
        class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors shadow-sm text-gray-700 dark:text-gray-300 font-medium text-sm">
        <svg class="w-5 h-5" viewBox="0 0 48 48">
            <path fill="#FFC107"
                d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.2 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.5 6.5 29 5 24 5 12.9 5 4 13.9 4 25s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z" />
            <path fill="#FF3D00"
                d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.5 6.5 29 5 24 5 16.3 5 9.6 9.3 6.3 14.7z" />
            <path fill="#4CAF50"
                d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.1C29.3 36.5 26.8 37.5 24 37.5c-5.2 0-9.6-3.5-11.2-8.2l-6.6 5.1C9.5 40.5 16.2 45 24 45z" />
            <path fill="#1976D2"
                d="M43.6 20.5H42V20H24v8h11.3c-1 2.7-3 4.9-5.7 6.4l6.2 5.1C39.8 36.1 44 30.9 44 25c0-1.3-.1-2.7-.4-4.5z" />
        </svg>
        Google
    </button>
    <button type="button"
        class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors shadow-sm text-gray-700 dark:text-gray-300 font-medium text-sm">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path
                d="M16.365 1.43c0 1.14-.44 2.2-1.17 2.98-.77.82-2.03 1.45-3.15 1.36-.14-1.1.4-2.27 1.14-3.07.8-.85 2.15-1.46 3.18-1.27zM20.7 17.27c-.59 1.37-1.3 2.64-2.32 3.83-.88 1.02-1.96 2.16-3.37 2.16-1.33 0-1.67-.86-3.48-.86-1.82 0-2.2.86-3.5.86-1.38 0-2.33-1.05-3.2-2.06-2.45-2.86-4.32-8.09-1.8-12.17 1.26-2.03 3.51-3.31 5.94-3.31 1.31 0 2.55.9 3.48.9.9 0 2.4-1.1 4.04-.94.69.03 2.62.28 3.86 2.1-.1.06-2.3 1.35-2.28 4.01.02 3.18 2.78 4.24 2.83 4.27z" />
        </svg>
        Apple
    </button>
</div>

<p class="mt-8 text-center text-sm text-gray-500">
    Hesabınız yok mu?
    <a routerLink="/register" class="text-indigo-500 dark:text-indigo-400 font-semibold hover:underline">Kaydolun</a>
</p>
