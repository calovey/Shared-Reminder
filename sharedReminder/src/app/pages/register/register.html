<div class="text-center mb-8">
    <!-- <p class="text-xs uppercase tracking-[0.35em] text-indigo-500 dark:text-indigo-300 mb-3">New Member</p> -->
    <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Üye Kaydı Oluştur</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Aynı tasarım içinde hızlıca hesabını oluştur.</p>
</div>

<form class="space-y-4" (ngSubmit)="register()">
    <div *ngIf="errorMessage" class="mb-4 text-sm text-red-500 text-center">
        {{ errorMessage }}
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ad Soyad</label>
        <input type="text" [(ngModel)]="fullName" name="fullName" required
            class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all dark:text-white"
            placeholder="xxx xxx">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-posta</label>
        <input type="email" [(ngModel)]="email" name="email" required
            class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all dark:text-white"
            placeholder="xxx@mail.com">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Şifre</label>
            <input type="password" [(ngModel)]="password" name="password" required
                class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all dark:text-white"
                placeholder="••••••••">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Şifre Tekrar</label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all dark:text-white"
                placeholder="••••••••">
        </div>
    </div>

    <button type="submit" [disabled]="loading"
        class="w-full py-3 px-4 mt-4 bg-gradient-to-r from-indigo-600 to-fuchsia-600 hover:from-indigo-700 hover:to-fuchsia-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-95 disabled:opacity-50">
        <span *ngIf="!loading">Kaydı Tamamla</span>
        <span *ngIf="loading">Hesap Oluşturuluyor...</span>
    </button>
</form>

<p class="mt-8 text-center text-sm text-gray-500">
    Zaten hesabın var mı?
    <a routerLink="/login" class="text-indigo-500 dark:text-indigo-400 font-semibold hover:underline">Giriş Yap</a>
</p>
